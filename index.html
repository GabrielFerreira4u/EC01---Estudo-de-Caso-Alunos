<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudo de Caso – Alunos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Gestão de Alunos</span>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- avisos (substituem os alert()) -->
    <div id="avisos"></div>

    <!-- resumo -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Total de alunos</div>
            <div class="fs-3 fw-bold" id="resumoTotal">0</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Média das notas</div>
            <div class="fs-3 fw-bold" id="resumoMedia">–</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Aprovados</div>
            <div class="fs-3 fw-bold" id="resumoAprovados">0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">

      <!-- formulário -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold" id="tituloForm">Cadastrar aluno</div>
          <div class="card-body">
            <form id="formAluno" novalidate>
              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome">
              </div>
              <div class="mb-3">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" class="form-control" id="idade" min="0">
              </div>
              <div class="mb-3">
                <label for="curso" class="form-label">Curso</label>
                <select class="form-select" id="curso">
                  <option value="JavaScript">JavaScript</option>
                  <option value="Python">Python</option>
                  <option value="Java">Java</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="notaFinal" class="form-label">Nota Final</label>
                <input type="number" class="form-control" id="notaFinal" min="0" max="10" step="0.1">
              </div>
              <div class="d-grid gap-2">
                <button type="button" class="btn btn-primary" id="btnSalvar">Cadastrar</button>
                <button type="button" class="btn btn-outline-secondary" id="btnCancelar" hidden>Cancelar edição</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- tabela -->
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Alunos cadastrados</div>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Nome</th><th>Idade</th><th>Curso</th><th>Nota</th><th>Situação</th><th class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaAlunos"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- relatórios -->
    <div class="card shadow-sm mt-4">
      <div class="card-header fw-semibold">Relatórios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnAprovados">Listar aprovados</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnMediaNotas">Média das notas</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnMediaIdades">Média das idades</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnAlfabetica">Nomes em ordem alfabética</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="btnPorCurso">Alunos por curso</button>
        </div>
        <pre class="bg-body-secondary rounded p-3 mb-0" id="relatorio">Escolha um relatório acima.</pre>
      </div>
    </div>

  </main>

  <script src="aluno.js"></script>
  <script src="app.js"></script>
</body>
</html>
